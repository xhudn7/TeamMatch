<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    
    <title>Registration</title>
    <link rel="stylesheet" href="stely2.css">
    
</head>
<body>
    
    <div class="container">
        <div class="title" id="mainTitle"> Registration</div>
        <form action="#">
            <div class="user-details">
                <div class="input-box">
                    <span class="details">First Name</span>
                    <input type="text" placeholder="Faisal" required>
                </div>
                <div class="input-box">
                    <span class="details">Last Name</span>
                    <input type="text" placeholder="Khalied" required>
                </div>
                <div class="input-box">
                    <span class="details">Email</span>
                    <input type="email" placeholder="example@gmail.com" required>
                </div>
                <div class="input-box">
                    <span class="details">Password</span>
                    <input type="password" required>
                </div>
                <div class="gender-details">
                    <input type="radio" name="gender" id="dot-1" >
                    <input type="radio" name="gender" id="dot-2" >
                    <span class="gender-title">Gender</span>
                    <div class="category">
                        <label for="dot-1">
                            <span class="dot-1"></span>
                            <span class="gender">Male</span>
                        </label>
                        <label for="dot-2">
                            <span class="dot-2"></span>
                            <span class="gender">Female</span>
                        </label>
                    </div>
                </div>
                <div class="major-box">
                    <span class="details">Select Major</span>
                    
        
                    <select id="major">
                        <option value="IS">IS</option>
                        <option value="IT">IT</option>
                        <option value="CS">CS</option>
                    </select>
                </div>
                
            </div>
            <div class="button">
                    <input type="submit" value="Register" >
                </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
